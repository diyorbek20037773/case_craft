# CaseCraft — production-ga yaqin stek.
#   docker compose up -d --build      ->  http://localhost:8080
# Kalitlar: server/.env (namuna: server/.env.example). Fayl bo'lmasa ham ishlaydi (mock LLM).
name: casecraft

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    image: ${REGISTRY:-ghcr.io/diyorbek20037773}/casecraft-server:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: server/.env
        required: false
    environment:
      # nginx /api/ prefiksi bilan proxy qiladi — audio_url to'g'ri chiqishi uchun
      ROOT_PATH: /api
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - tts-cache:/app/server/cache
      - session-logs:/app/server/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      target: runtime
      args:
        VITE_API_URL: /api
    image: ${REGISTRY:-ghcr.io/diyorbek20037773}/casecraft-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://server:8000
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    logging: *logging

volumes:
  tts-cache:
  session-logs:
