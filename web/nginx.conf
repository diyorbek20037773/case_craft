# nginx shabloni: ${BACKEND_URL} konteyner ishga tushganda envsubst bilan almashtiriladi.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index intro.html index.html;

    # /stt audio (backend chegarasi 8 MB, base64 bilan ~11 MB)
    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf+json application/wasm;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend: /api/turn -> http://server:8000/turn
    # ^~ — quyidagi regex (.mp3 va h.k.) qoidalaridan ustun turadi
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite xeshlangan fayllar — uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D modellar, teksturalar, draco
    location ~* \.(glb|gltf|bin|hdr|ktx2|wasm|png|jpg|jpeg|webp|svg|mp3|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = / {
        try_files /intro.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
